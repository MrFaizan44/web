<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #dbeafe;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        p {
            cursor: pointer;
        }

        #bulb {
            display: block;
            width: 120px;
            height: 120px;
            padding: 0;
            line-height: 120px;
            font-size: 64px;
            margin: 20px auto;
            border-radius: 50%;
            filter: grayscale(1);
            transition: filter 0.3s ease;
        }

        #bulb.on {
            filter: grayscale(0);
            background-color: #facc15;
            box-shadow: 0 0 100px 50px #facc15;
        }
    </style>
</head>
<body>
    <h2>Javascript Lecture</h2>
    <span id="bulb">&#128161;</span>
    <p id="nm" onclick="turnOn()">Click this paragraph to turn the light on.</p>

    <p id="Hamza" onclick="turnOff()">Click this paragraph to turn the light off.</p>
    <button onclick="turnOn(); document.getElementById('Hamza').innerHTML = 'Hamza will bring her laptop'">Click Me</button>
    <button onclick="turnOff(); document.getElementById('nm').style.color = 'red'; document.getElementById('nm').innerHTML = 'Hamza will bring her laptop'">Don't touch me</button>
    <script> 
        function turnOn(){
            document.getElementById('bulb').classList.add('on');
            document.body.style.backgroundColor = '#fef3c7';
        }

        function turnOff(){
            document.getElementById('bulb').classList.remove('on');
            document.body.style.backgroundColor = '#dbeafe';
        }

        function sum(){
            let x=7;
            let y=8;
            let z=x+y;
            alert(z);
        }
    </script>
</body>
</html>
