<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Press Demo</title>
</head>
<body>
    <h1>Press Enter in the box</h1>

    <input type="text" id="myInput" placeholder="Type here and press Enter">
    <p id="result">Key pressed: --</p>

    <script>
        const input = document.getElementById('myInput');
        const result = document.getElementById('result');
        const keyHistory = [];

        input.addEventListener('keydown', function (event) {
            keyHistory.push(event.key);

            if (event.key === 'Enter') {
                result.textContent = 'Key pressed: ' + event.key + ' | History: ' + keyHistory.join(', ');
            }
        });
    </script>
</body>
</html>
